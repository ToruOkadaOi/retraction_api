name: Sync Retraction Data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-retraction-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Check code and regression tests
        run: |
          python -m ruff check app mcp_server scripts tests
          python -m pytest -q

      - name: Fetch latest CSV from retraction_watch_data
        run: |
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 180 -o retraction_watch.csv \
            https://raw.githubusercontent.com/ToruOkadaOi/retraction_watch_data/main/retraction_watch.csv

      - name: Validate downloaded CSV
        run: python scripts/validate_csv.py retraction_watch.csv

      - name: Validate ingestion before publishing
        env:
          CSV_PATH: retraction_watch.csv
          DATABASE_URL: sqlite:///${{ runner.temp }}/retraction-sync.db
        run: python scripts/ingest_csv.py

      - name: Check if CSV changed
        id: check
        run: |
          if ! git diff --quiet retraction_watch.csv; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add retraction_watch.csv
          git commit -m "update retraction watch data"
          git push
