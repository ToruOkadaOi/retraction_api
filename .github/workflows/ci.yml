name: Code CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check app mcp_server scripts tests
      - name: Test
        run: python -m pytest -q
      - name: Validate and ingest the complete snapshot
        env:
          CSV_PATH: retraction_watch.csv
          DATABASE_URL: sqlite:///${{ runner.temp }}/retraction-ci.db
        run: python scripts/ingest_csv.py
